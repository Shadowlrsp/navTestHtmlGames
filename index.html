<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas { display: block; }
        body { margin: 0; overflow: hidden; background-color: #050510; font-family: monospace; user-select: none; }
    </style>
</head>
<body class="relative w-screen h-screen text-white select-none overflow-hidden">

    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full"></canvas>

    <div id="hud" class="hidden absolute inset-x-0 top-0 p-3 md:p-6 flex justify-between items-start pointer-events-none z-10">
        <div class="flex flex-col gap-0.5 md:gap-1 text-xs md:text-sm font-bold tracking-wider text-cyan-400 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
            <div>SCORE: <span id="scoreDisplay">0</span></div>
            <div class="text-yellow-400">💎: <span id="crystalDisplay">0</span></div>
        </div>

        <div id="bossHud" class="hidden flex flex-col items-center gap-0.5 absolute left-1/2 -translate-x-1/2 top-2 w-36 md:w-64 pointer-events-none">
            <span class="text-[9px] md:text-xs font-bold text-red-500 tracking-widest text-center animate-pulse">ALERTE : BOSS</span>
            <div class="w-full h-1 md:h-2 border border-red-500 bg-red-950/50 rounded overflow-hidden">
                <div id="bossHealthBar" class="h-full bg-red-600 w-full transition-all duration-75"></div>
            </div>
        </div>

        <div class="flex flex-col items-end gap-1 w-24 md:w-44">
            <div class="w-full h-1.5 md:h-3 border border-cyan-500 bg-cyan-950/40 rounded overflow-hidden">
                <div id="healthBar" class="h-full bg-cyan-400 w-full transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <button id="pauseBtn" class="hidden absolute top-3 right-3 md:top-6 md:right-6 z-20 px-2.5 py-1 text-[10px] md:text-xs font-bold bg-cyan-950/60 border border-cyan-500 rounded hover:bg-cyan-500/20 tracking-wider">PAUSE</button>

    <div id="mainMenu" class="absolute inset-0 flex flex-col items-center justify-center bg-black/70 z-30 p-4">
        <h1 class="text-3xl md:text-5xl font-extrabold text-cyan-400 tracking-widest mb-2 text-center drop-shadow-[0_0_15px_#00f3ff]">SPACE SHOOTER</h1>
        <p class="text-xs md:text-sm text-cyan-600 mb-8 tracking-wider text-center">esquive, tire et survis</p>
        <button id="startBtn" class="px-6 py-2.5 md:px-8 md:py-3 bg-cyan-500 border border-cyan-400 text-black font-black tracking-widest rounded hover:bg-transparent hover:text-cyan-400 transition-all duration-300 text-sm md:text-base shadow-[0_0_15px_rgba(0,243,255,0.4)]">LANCER LA PARTIE</button>
    </div>

    <div id="gameOverMenu" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-black/85 z-30 p-4">
        <h2 class="text-2xl md:text-4xl font-black text-red-500 tracking-widest mb-2 drop-shadow-[0_0_10px_#ff0055]">VAINCU EN VOL</h2>
        <p class="text-sm md:text-lg mb-6">SCORE FINAL : <span id="finalScore" class="text-cyan-400 font-bold">0</span></p>
        
        <div class="w-full max-w-xs bg-slate-950/60 border border-slate-800 p-3 rounded mb-6 text-xs md:text-sm">
            <h3 class="text-center font-bold tracking-wider text-slate-400 mb-2 border-b border-slate-800 pb-1">MEILLEURS SCORES</h3>
            <ul id="leaderboard" class="flex flex-col gap-1 font-mono text-center text-slate-300"></ul>
        </div>

        <div class="flex gap-3">
            <button id="restartBtn" class="px-4 py-2 bg-cyan-500 text-black font-bold tracking-wider rounded text-xs md:text-sm hover:bg-cyan-400">REJOUER</button>
            <button id="goShopBtn" class="px-4 py-2 bg-yellow-600 text-white font-bold tracking-wider rounded text-xs md:text-sm hover:bg-yellow-500">BOUTIQUE 💎</button>
        </div>
    </div>

    <div id="shopMenu" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-black/90 z-30 p-4">
        <h2 class="text-2xl md:text-3xl font-black text-yellow-400 tracking-widest mb-6 drop-shadow-[0_0_10px_rgba(234,179,8,0.3)]">BOUTIQUE D'AMÉLIORATIONS</h2>
        
        <div id="upgradeList" class="w-full max-w-xs md:max-w-md flex flex-col gap-2 md:gap-3 mb-8 text-xs md:text-sm">
            </div>

        <button id="shopPlayBtn" class="px-6 py-2.5 bg-cyan-500 text-black font-black tracking-widest rounded text-xs md:text-sm hover:bg-cyan-400">RETOURNER AU COMBAT</button>
    </div>

    <div id="shopMenu" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/95 interactive hidden">
        <h2 class="text-3xl font-bold mb-4 text-yellow-400">AMÉLIORATIONS</h2>
        <div id="upgradeList" class="w-full max-w-md px-4 space-y-2 overflow-y-auto max-h-[60vh]"></div>
        <button id="shopPlayBtn" class="btn-neon px-8 py-2 rounded font-bold mt-6">REPRENDRE</button>
    </div>

    <div id="gameOverMenu" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-red-900/30 interactive hidden">
        <h2 class="text-4xl font-bold mb-2 text-red-500">DÉTRUIT</h2>
        <p class="text-xl mb-2">SCORE: <span id="finalScore">0</span></p>
        <h3 class="text-yellow-400 mb-2">LEADERBOARD</h3>
        <ul id="leaderboard" class="mb-6 text-sm text-center"></ul>
        <div class="flex gap-4">
            <button id="restartBtn" class="btn-neon px-6 py-3 rounded">REJOUER</button>
            <button id="goShopBtn" class="px-6 py-3 border border-yellow-500 text-yellow-500 rounded">SHOP</button>
        </div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
